te(45deg); opacity: 1; filter: drop-shadow(0 0 5px rgba(217, 75, 130, 0.7)); } } @keyframes grandLeapMotion { 0% { transform: translate(114px, 28px) scale(0.1) rotate(0deg); opacity: 0; } 8% { transform: translate(130px, 23px) scale(0.9) rotate(30deg); opacity: 0.95; filter: drop-shadow(0 0 3px rgba(26, 115, 232, 0.7)); } 30% { transform: translate(195px, 12px) scale(1.15) rotate(100deg); opacity: 1; filter: drop-shadow(0 0 6px rgba(124, 82, 149, 0.85)); } 60% { transform: translate(295px, 13px) scale(1.2) rotate(200deg); opacity: 1; filter: drop-shadow(0 0 7px rgba(217, 75, 130, 0.9)); } 85% { transform: translate(368px, 22px) scale(1.25) rotate(290deg); opacity: 1; filter: drop-shadow(0 0 9px rgba(217, 75, 130, 1)) drop-shadow(0 0 15px rgba(26, 115, 232, 0.6)); } 94% { transform: translate(368px, 22px) scale(1.1) rotate(320deg); opacity: 0.8; } 100% { transform: translate(368px, 22px) scale(0.2) rotate(360deg); opacity: 0; } } @keyframes arcTrailDash { 0% { stroke-dashoffset: 60; opacity: 0; } 8% { opacity: 0.7; } 40% { opacity: 0.75; } 80% { opacity: 0.7; } 88% { stroke-dashoffset: -270; opacity: 0.4; } 94%, 100% { stroke-dashoffset: -300; opacity: 0; } } .anim-icon-star { transform-origin: 54px 22px; animation: iconStarSpin 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; } .anim-grand-leap { animation: grandLeapMotion 2.5s cubic-bezier(0.3, 0, 0.2, 1) infinite; } .anim-arc-trail { stroke-dasharray: 60 260; animation: arcTrailDash 2.5s cubic-bezier(0.3, 0, 0.2, 1) infinite; }</style></defs><rect x="0" y="0" width="430" height="96" rx="18" fill="url(#bannerBg)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#bannerShadow)"/><g transform="translate(20, 12)"><rect x="0" y="0" width="72" height="72" rx="18" fill="url(#iconBoxBg)" stroke="#E1E7EE" stroke-width="1.2"/><path d="M 18 52 L 36 24 L 54 52" fill="none" stroke="#D3DBE5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 23 50 L 36 30 L 49 50" fill="none" stroke="url(#geminiGrad)" strok